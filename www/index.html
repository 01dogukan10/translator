<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çizgi Çevirici</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee}
  [hidden]{display:none!important}
  button,label.btn,select,input[type=text]{font-size:15px;border:0;border-radius:10px;padding:11px 14px;color:#fff;background:#333}
  button,label.btn{cursor:pointer}
  .mavi{background:#3b82f6}.gri{background:#444}.kirmizi{background:#dc2626}
  input[type=file]{display:none}
  input[type=text]{width:100%;background:#2a2a2a}
  select{flex:1;min-width:0}
  .satir{display:flex;gap:8px;align-items:center}

  /* Kütüphane */
  #kutuphane{padding:14px;padding-top:max(14px,env(safe-area-inset-top));max-width:720px;margin:0 auto}
  h1{font-size:22px;margin:4px 0 14px}
  h2{font-size:16px;color:#aaa;margin:22px 0 8px}
  .ekle{display:flex;flex-direction:column;gap:8px}
  .ekle .satir button,.ekle .satir label{flex:1;text-align:center}
  #kdurum{font-size:13px;color:#fbbf24;min-height:16px}
  .kart{display:flex;align-items:center;gap:6px;background:#1d1d1d;border-radius:12px;margin-bottom:8px;padding:6px 6px 6px 14px}
  .kartic{flex:1;min-width:0;padding:8px 0;cursor:pointer}
  .kb{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ka{font-size:12px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kart button{background:transparent;padding:10px}
  #bos{color:#777;font-size:14px}

  /* Okuyucu */
  #ust{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(24,24,24,.96);padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));transition:transform .2s}
  #ust.gizli{transform:translateY(-110%)}
  #ust button{padding:8px 12px;background:#333}
  #ust button.kirmizi{background:#dc2626}
  #baslik{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  #durum{font-size:12px;color:#aaa;margin-top:4px;min-height:15px}
  #sayfalar{max-width:900px;margin:0 auto}
  #sayfalar canvas,#sayfalar img{width:100%;display:block;margin-bottom:2px}

  /* Pencere */
  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  #sheet .kutu{background:#1d1d1d;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  #sheet h3{margin:0}
  #sBilgi{font-size:13px;color:#9ca3af}
  #sButonlar{display:flex;flex-direction:column;gap:8px;margin-top:4px}
</style>
</head>
<body>

<!-- ===== KİTAPLIK ===== -->
<section id="kutuphane">
  <h1>📚 Çizgi Çevirici</h1>
  <div class="ekle">
    <input id="girdi" type="text" inputmode="url" autocomplete="off" placeholder="Bölüm veya resim linkini yapıştır (https://...)">
    <div class="satir">
      <button id="devam" class="mavi">Devam →</button>
      <label class="btn gri">📂 Dosyadan ekle<input id="dosya" type="file" accept="image/*" multiple></label>
    </div>
    <div id="kdurum"></div>
  </div>
  <h2>Kitaplığım</h2>
  <div id="liste"></div>
  <p id="bos">Henüz bir şey eklemedin. Yukarıya bir link yapıştırıp Devam'a bas.</p>
</section>

<!-- ===== OKUYUCU (sadece sayfalar) ===== -->
<section id="okuyucu" hidden>
  <div id="ust">
    <div class="satir">
      <button id="geri">←</button>
      <div id="baslik"></div>
      <button id="dur" class="kirmizi" hidden>⏹</button>
      <button id="cbzBtn" title=".cbz olarak kaydet">📦</button>
      <button id="ayarAc">🌐</button>
    </div>
    <div id="durum"></div>
  </div>
  <div id="sayfalar"></div>
</section>

<!-- ===== KAYIT / DÜZENLEME / DİL AYARI PENCERESİ ===== -->
<div id="sheet" hidden>
  <div class="kutu">
    <h3 id="sBaslik"></h3>
    <input id="sAd" type="text" placeholder="Başlık">
    <div id="sBilgi"></div>
    <div class="satir">
      <select id="sKaynak"></select>
      <button id="sDegis" class="gri" title="Dilleri değiştir">⇄</button>
      <select id="sHedef"></select>
    </div>
    <div id="sButonlar"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const bekle = ms => new Promise(r => setTimeout(r, ms));

// [Tesseract kodu, çeviri kodu, görünen ad]
const DILLER = [
  ['eng','en','İngilizce'], ['tur','tr','Türkçe'], ['jpn','ja','Japonca'], ['kor','ko','Korece'],
  ['chi_sim','zh-CN','Çince (Basit)'], ['chi_tra','zh-TW','Çince (Geleneksel)'],
  ['fra','fr','Fransızca'], ['spa','es','İspanyolca'], ['deu','de','Almanca'], ['ita','it','İtalyanca'],
  ['por','pt','Portekizce'], ['rus','ru','Rusça'], ['ind','id','Endonezce'], ['ara','ar','Arapça']
];
const bul = t => DILLER.find(d => d[0] === t) || [];
const mKodu = t => bul(t)[1];
const dilAdi = t => bul(t)[2] || t;
const hedefAdi = m => (DILLER.find(d => d[1] === m) || [])[2] || m;

// ---------- Küçük ayarlar (localStorage) ----------
const depo = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch {} };
const onbellekOku = k => { try { return JSON.parse(depo('dilOnbellek') || '{}')[k]; } catch { return undefined; } };
const onbellekYaz = (k, v) => { try { const o = JSON.parse(depo('dilOnbellek') || '{}'); o[k] = v; depo('dilOnbellek', JSON.stringify(o)); } catch {} };

// ---------- Kitaplık veritabanı (IndexedDB: linkler ve dosyalar burada saklanır) ----------
let _db = null;
const veritabani = () => _db || (_db = new Promise((ok, hata) => {
  const r = indexedDB.open('cizgi-cevirici', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kitaplik', { keyPath: 'id' });
  r.onsuccess = () => ok(r.result);
  r.onerror = () => hata(r.error);
}));
async function idb(mod, fn) {
  const db = await veritabani();
  return new Promise((ok, hata) => {
    const tx = db.transaction('kitaplik', mod);
    const r = fn(tx.objectStore('kitaplik'));
    tx.oncomplete = () => ok(r && r.result);
    tx.onerror = tx.onabort = () => hata(tx.error || new Error('Veritabanı hatası'));
  });
}
const hepsiniGetir = () => idb('readonly', s => s.getAll());
const getirId = id => idb('readonly', s => s.get(id));
const kaydetItem = it => idb('readwrite', s => s.put(it));
const silItem = id => idb('readwrite', s => s.delete(id));
const yeniId = () => 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ---------- Ağ: uygulamada doğrudan, tarayıcıda proxy ile ----------
const native = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const Http = native ? Capacitor.Plugins.CapacitorHttp : null;
const UA = 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36';
const proxyResim = u => 'https://wsrv.nl/?url=' + encodeURIComponent(u);
const proxySayfa = u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u);

function seriAnahtari(link) {
  try {
    const u = new URL(link);
    return u.hostname + '/' + u.pathname.split('/').filter(Boolean).slice(0, 2).join('/');
  } catch { return null; }
}

async function sayfaHtml(link) {
  if (native) {
    const r = await Http.get({ url: link, headers: { 'User-Agent': UA } });
    return typeof r.data === 'string' ? r.data : JSON.stringify(r.data);
  }
  return (await fetch(proxySayfa(link))).text();
}

async function resimKaynagi(oge) {
  if (!oge.proxy) return oge.kaynak;
  if (native) {
    const r = await Http.get({
      url: oge.kaynak,
      headers: { 'User-Agent': UA, 'Referer': oge.ref || oge.kaynak },
      responseType: 'blob'
    });
    const h = r.headers || {};
    const tip = (h['Content-Type'] || h['content-type'] || 'image/jpeg').split(';')[0];
    return `data:${tip};base64,${r.data}`;
  }
  return proxyResim(oge.kaynak);
}

async function resimYukle(oge, tut = false) {
  if (oge.img) return oge.img;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = await resimKaynagi(oge);
  await img.decode();
  if (tut) oge.img = img;
  return img;
}

// Linkteki başlığı ve sayfa resimlerini bulur
async function sayfaBilgisi(link) {
  if (/\.(jpe?g|png|webp|gif)(\?|$)/i.test(link)) {
    let ad = 'Resim';
    try { ad = decodeURIComponent(new URL(link).pathname.split('/').pop()) || ad; } catch {}
    return { baslik: ad, resimler: [link] };
  }
  const doc = new DOMParser().parseFromString(await sayfaHtml(link), 'text/html');
  const og = doc.querySelector('meta[property="og:title"]');
  let baslik = ((og && og.content) || doc.title || '').replace(/\s+/g, ' ').trim();
  if (!baslik) { try { baslik = new URL(link).hostname; } catch { baslik = 'Adsız'; } }

  const baz = (doc.querySelector('base') || {}).href || link;
  const gorulen = new Set(), resimler = [];
  doc.querySelectorAll('img').forEach(img => {
    const ham = img.getAttribute('data-src') || img.getAttribute('data-lazy-src') ||
                img.getAttribute('data-original') || img.getAttribute('src');
    if (!ham) return;
    let tam;
    try { tam = new URL(ham.trim(), baz).href; } catch { return; }
    if (!/^https?:/.test(tam) || gorulen.has(tam)) return;
    if (/logo|avatar|icon|banner|sprite|thumb|ads?[\/_.-]|\.svg/i.test(tam)) return;
    gorulen.add(tam);
    resimler.push(tam);
  });
  return { baslik: baslik.slice(0, 100), resimler };
}

// ===================== ARAYÜZ: KİTAPLIK =====================
const kdurum = m => { $('kdurum').textContent = m || ''; };

function kartYap(it) {
  const kart = document.createElement('div');
  kart.className = 'kart';

  const ic = document.createElement('div');
  ic.className = 'kartic';
  const b = document.createElement('div');
  b.className = 'kb';
  b.textContent = (it.tur === 'link' ? '🔗 ' : '📁 ') + it.baslik; // textContent: sayfadan gelen başlık güvenle yazılır
  const a = document.createElement('div');
  a.className = 'ka';
  let kaynakYer = 'Dosya';
  if (it.tur === 'link') { try { kaynakYer = new URL(it.link).hostname; } catch { kaynakYer = 'Link'; } }
  const kd = it.kaynak === 'auto' ? (it.algilanan ? dilAdi(it.algilanan) : 'Otomatik') : dilAdi(it.kaynak);
  a.textContent = `${kaynakYer} · ${it.sayfaSayisi || '?'} sayfa · ${kd} → ${hedefAdi(it.hedef)}` + (it.cbz ? ' · 📦 kayıtlı' : '');
  ic.append(b, a);
  ic.onclick = () => ac(it.id);

  const duz = document.createElement('button');
  duz.textContent = '✏️';
  duz.onclick = () => sheetAc('duzenle', it);
  const sil = document.createElement('button');
  sil.textContent = '🗑';
  sil.onclick = async () => {
    if (!confirm(`"${it.baslik}" kitaplıktan silinsin mi?`)) return;
    await silItem(it.id);
    kutuphaneyiYenile();
  };
  kart.append(ic, duz, sil);
  return kart;
}

async function kutuphaneyiYenile() {
  const liste = (await hepsiniGetir()).sort((a, b) => (b.sonOkunma || b.eklenme) - (a.sonOkunma || a.eklenme));
  $('liste').textContent = '';
  $('bos').hidden = liste.length > 0;
  liste.forEach(it => $('liste').appendChild(kartYap(it)));
}

$('devam').onclick = async () => {
  const link = $('girdi').value.trim();
  if (!/^https?:\/\//i.test(link)) { kdurum('Geçerli bir link gir (https:// ile başlamalı).'); return; }
  try {
    const mevcut = (await hepsiniGetir()).find(x => x.link === link);
    if (mevcut) { kdurum('Bu link zaten kitaplıkta, açılıyor...'); ac(mevcut.id); return; }
  } catch {}
  $('devam').disabled = true;
  kdurum('Link kontrol ediliyor...');
  try {
    const b = await sayfaBilgisi(link);
    if (!b.resimler.length) throw new Error('Bu linkte sayfa (resim) bulunamadı.');
    kdurum('');
    sheetAc('yeni', {
      tur: 'link', link, baslik: b.baslik, resimler: b.resimler, sayfaSayisi: b.resimler.length,
      kaynak: depo('kaynak') || 'auto', hedef: depo('hedef') || 'tr'
    });
  } catch (e) { kdurum('Hata: ' + e.message); }
  finally { $('devam').disabled = false; }
};
$('girdi').addEventListener('keydown', e => { if (e.key === 'Enter') $('devam').click(); });

$('dosya').onchange = e => {
  const dosyalar = [...e.target.files]
    .filter(f => f.type.startsWith('image/'))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  e.target.value = '';
  if (!dosyalar.length) return;
  const ilk = dosyalar[0].name.replace(/\.[^.]+$/, '');
  sheetAc('yeni', {
    tur: 'dosya', dosyalar, sayfaSayisi: dosyalar.length,
    baslik: dosyalar.length > 1 ? `${ilk} (+${dosyalar.length - 1})` : ilk,
    kaynak: depo('kaynak') || 'auto', hedef: depo('hedef') || 'tr'
  });
};

// ===================== PENCERE (kaydet / düzenle / dil ayarı) =====================
let sheet = null;

function dilKutulariniDoldur() {
  $('sKaynak').innerHTML = '<option value="auto">🔎 Otomatik algıla</option>' +
    DILLER.map(d => `<option value="${d[0]}">${d[2]}</option>`).join('');
  $('sHedef').innerHTML = DILLER.map(d => `<option value="${d[1]}">${d[2]}</option>`).join('');
}

function sheetAc(mod, veri) {
  sheet = { mod, veri };
  $('sBaslik').textContent = { yeni: 'Kitaplığa ekle', duzenle: 'Düzenle', ayar: 'Dil ayarları' }[mod];
  $('sAd').hidden = mod === 'ayar';
  $('sAd').value = veri.baslik || '';
  $('sBilgi').textContent = mod === 'yeni' ? `${veri.sayfaSayisi} sayfa bulundu.` : '';
  dilKutulariniDoldur();
  $('sKaynak').value = veri.kaynak || 'auto';
  $('sHedef').value = veri.hedef || 'tr';

  const dugmeler = {
    yeni: [['Kaydet ve oku', 'oku', 'mavi'], ['Sadece kaydet', 'kaydet', 'gri'], ['İptal', 'iptal', 'gri']],
    duzenle: [['Kaydet', 'kaydet', 'mavi'], ['İptal', 'iptal', 'gri']],
    ayar: [['Uygula ve yeniden çevir', 'kaydet', 'mavi'],
           ...(veri.cbz ? [['Kayıtlı çeviriyi sil, baştan çevir', 'sifirla', 'gri']] : []),
           ['İptal', 'iptal', 'gri']]
  }[mod];
  $('sButonlar').textContent = '';
  dugmeler.forEach(([ad, eylem, sinif]) => {
    const b = document.createElement('button');
    b.textContent = ad; b.className = sinif;
    b.onclick = () => sheetEylem(eylem);
    $('sButonlar').appendChild(b);
  });
  $('sheet').hidden = false;
}
const sheetKapat = () => { $('sheet').hidden = true; sheet = null; };
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) sheetKapat(); });

$('sDegis').onclick = () => {
  const k = $('sKaynak').value;
  if (k === 'auto') return;
  const yeniKaynak = (DILLER.find(d => d[1] === $('sHedef').value) || [])[0];
  $('sHedef').value = mKodu(k);
  if (yeniKaynak) $('sKaynak').value = yeniKaynak;
};

async function sheetEylem(eylem) {
  if (eylem === 'iptal' || !sheet) return sheetKapat();
  const { mod, veri } = sheet;
  const ad = ($('sAd').value.trim() || veri.baslik || 'Adsız').slice(0, 100);
  const kaynak = $('sKaynak').value, hedef = $('sHedef').value;
  depo('kaynak', kaynak); depo('hedef', hedef);
  sheetKapat();

  try {
    if (mod === 'yeni') {
      const it = {
        id: yeniId(), tur: veri.tur, baslik: ad, kaynak, hedef,
        sayfaSayisi: veri.sayfaSayisi, eklenme: Date.now(), sonOkunma: null
      };
      if (veri.tur === 'link') { it.link = veri.link; it.resimler = veri.resimler; }
      else it.dosyalar = veri.dosyalar;
      await kaydetItem(it);
      $('girdi').value = '';
      await kutuphaneyiYenile();
      if (eylem === 'oku') ac(it.id);
    } else if (mod === 'duzenle') {
      const it = await getirId(veri.id);
      if (!it) return;
      if (it.kaynak !== kaynak) it.algilanan = undefined;
      if (it.kaynak !== kaynak || it.hedef !== hedef) it.cbz = null;
      Object.assign(it, { baslik: ad, kaynak, hedef });
      await kaydetItem(it);
      kutuphaneyiYenile();
    } else { // ayar (okuyucu içinden)
      if (acik.kaynak !== kaynak) acik.algilanan = undefined;
      if (eylem === 'sifirla' || acik.kaynak !== kaynak || acik.hedef !== hedef) acik.cbz = null;
      Object.assign(acik, { kaynak, hedef });
      await kaydetItem(acik);
      $('baslik').textContent = acik.baslik;
      yenidenBaslat();
    }
  } catch (e) { kdurum('Kaydedilemedi: ' + e.message); }
}

// ===================== ARAYÜZ: OKUYUCU =====================
let acik = null;          // şu an okunan kitaplık öğesi
let calisiyor = false, iptal = false;

function ekranGoster(ad) {
  $('kutuphane').hidden = ad !== 'kutuphane';
  $('okuyucu').hidden = ad !== 'okuyucu';
  window.scrollTo(0, 0);
}

async function ac(id) {
  if (!$('okuyucu').hidden) return;
  const it = await getirId(id);
  if (!it) return;
  acik = it;
  history.pushState({ ekran: 'oku' }, ''); // telefonun geri tuşu okuyucudan kitaplığa döner
  ekranGoster('okuyucu');
  $('baslik').textContent = it.baslik;
  $('ust').classList.remove('gizli');
  $('sayfalar').style.paddingTop = ($('ust').offsetHeight + 4) + 'px';
  await yenidenBaslat();
}

async function yenidenBaslat() {
  iptal = true;
  while (calisiyor) await bekle(100);
  $('sayfalar').innerHTML = '';
  if (acik) await oku(acik);
}

async function geriDon() {
  iptal = true;
  acik = null;
  ekranGoster('kutuphane');
  while (calisiyor) await bekle(100);
  if (!acik) $('sayfalar').innerHTML = '';
  kutuphaneyiYenile().catch(() => {});
}

$('geri').onclick = () => history.back();
window.addEventListener('popstate', () => { if (!$('okuyucu').hidden) geriDon(); });
$('dur').onclick = () => { iptal = true; $('durum').textContent = 'Durduruluyor...'; };
$('ayarAc').onclick = () => acik && sheetAc('ayar', acik);
$('sayfalar').onclick = () => $('ust').classList.toggle('gizli'); // sayfaya dokununca üst çubuk gizlenir/görünür

async function oku(it) {
  calisiyor = true; iptal = false;
  $('dur').hidden = false;
  try {
    if (it.cbz && it.cbzKaynak === it.kaynak && it.cbzHedef === it.hedef) {
      try {
        it.sonOkunma = Date.now();
        await kaydetItem(it);
        await cbzGoster(it);
        return;
      } catch (e) {
        console.warn('Kayıtlı çeviri açılamadı, yeniden çevriliyor:', e);
        $('sayfalar').innerHTML = '';
      }
    }
    let liste;
    if (it.tur === 'dosya') {
      liste = it.dosyalar.map(b => ({ kaynak: URL.createObjectURL(b), proxy: false }));
    } else {
      $('durum').textContent = 'Sayfalar getiriliyor...';
      let resimler = [];
      try { resimler = (await sayfaBilgisi(it.link)).resimler; } catch (e) { if (!(it.resimler || []).length) throw e; }
      if (!resimler.length) resimler = it.resimler || [];
      if (!resimler.length) throw new Error('Sayfalar bulunamadı.');
      it.resimler = resimler; it.sayfaSayisi = resimler.length;
      liste = resimler.map(u => ({ kaynak: u, proxy: true, ref: it.link }));
    }
    it.sonOkunma = Date.now();
    await kaydetItem(it);
    await hepsiniIsle(liste, it);
  } catch (e) {
    $('durum').textContent = 'Hata: ' + e.message;
    $('ust').classList.remove('gizli');
  } finally {
    $('dur').hidden = true;
    calisiyor = false;
  }
}

// ===================== .CBZ (ZIP) YAZMA / OKUMA =====================
// .cbz = içinde sayfa resimleri olan zip. JPEG zaten sıkışık olduğu için "sıkıştırmasız" (store) yazıyoruz.
const CRC_TABLO = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLO[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

async function zipYap(dosyalar) { // dosyalar: [{ ad, blob }]
  const enc = new TextEncoder();
  const d = new Date();
  const saat = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const tarih = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const parcalar = [], merkez = [];
  let konum = 0;
  for (const f of dosyalar) {
    const ad = enc.encode(f.ad);
    const boyut = f.blob.size;
    const crc = crc32(new Uint8Array(await f.blob.arrayBuffer()));

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(10, saat, true); lh.setUint16(12, tarih, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, boyut, true); lh.setUint32(22, boyut, true); lh.setUint16(26, ad.length, true);
    parcalar.push(lh.buffer, ad, f.blob);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, saat, true); ch.setUint16(14, tarih, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, boyut, true); ch.setUint32(24, boyut, true); ch.setUint16(28, ad.length, true);
    ch.setUint32(42, konum, true);
    merkez.push(ch.buffer, ad);
    konum += 30 + ad.length + boyut;
  }
  const merkezBoyut = merkez.reduce((t, p) => t + (p.byteLength !== undefined ? p.byteLength : p.size), 0);
  const son = new DataView(new ArrayBuffer(22));
  son.setUint32(0, 0x06054b50, true);
  son.setUint16(8, dosyalar.length, true); son.setUint16(10, dosyalar.length, true);
  son.setUint32(12, merkezBoyut, true); son.setUint32(16, konum, true);
  return new Blob([...parcalar, ...merkez, son.buffer], { type: 'application/vnd.comicbook+zip' });
}

async function zipOku(blob) { // -> [{ ad, blob }]
  const kuyruk = Math.min(blob.size, 65557);
  const son = new DataView(await blob.slice(blob.size - kuyruk).arrayBuffer());
  let e = -1;
  for (let i = kuyruk - 22; i >= 0; i--) if (son.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('Geçersiz .cbz dosyası');
  const sayi = son.getUint16(e + 10, true), mBoyut = son.getUint32(e + 12, true), mKonum = son.getUint32(e + 16, true);
  const m = new DataView(await blob.slice(mKonum, mKonum + mBoyut).arrayBuffer());
  const dec = new TextDecoder();
  const girdiler = [];
  let p = 0;
  for (let i = 0; i < sayi; i++) {
    if (m.getUint32(p, true) !== 0x02014b50) break;
    const yontem = m.getUint16(p + 10, true), csize = m.getUint32(p + 20, true);
    const adU = m.getUint16(p + 28, true), exU = m.getUint16(p + 30, true), coU = m.getUint16(p + 32, true);
    const konum = m.getUint32(p + 42, true);
    const ad = dec.decode(new Uint8Array(m.buffer, p + 46, adU));
    p += 46 + adU + exU + coU;
    girdiler.push({ ad, yontem, csize, konum });
  }
  for (const g of girdiler) {
    const lh = new DataView(await blob.slice(g.konum, g.konum + 30).arrayBuffer());
    const bas = g.konum + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    let parca = blob.slice(bas, bas + g.csize);
    if (g.yontem === 8) parca = await new Response(parca.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
    g.blob = parca;
  }
  return girdiler;
}

const xmlKacis = t => String(t).replace(/[<>&"']/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[c]));
const guvenliAd = t => (String(t).replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 80)) || 'cizgi-roman';

async function cbzYap(it, bloblar) {
  const hane = Math.max(3, String(bloblar.length).length);
  const dosyalar = bloblar.map((b, i) => ({ ad: String(i + 1).padStart(hane, '0') + '.jpg', blob: b }));
  const xml = `<?xml version="1.0" encoding="utf-8"?>\n<ComicInfo>\n  <Title>${xmlKacis(it.baslik)}</Title>\n` +
              `  <LanguageISO>${xmlKacis(it.hedef)}</LanguageISO>\n  <PageCount>${bloblar.length}</PageCount>\n</ComicInfo>\n`;
  dosyalar.push({ ad: 'ComicInfo.xml', blob: new Blob([xml], { type: 'text/xml' }) });
  return zipYap(dosyalar);
}

let _Fs = null;
const Fs = () => _Fs || (_Fs = Capacitor.registerPlugin('Filesystem'));
const blobBase64 = b => new Promise((ok, hata) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1] || '');
  r.onerror = () => hata(r.error);
  r.readAsDataURL(b);
});

// Büyük dosyayı köprüden tek seferde göndermemek için 3 MB'lık parçalarla yazar (3'ün katı: base64 parçaları temiz birleşir)
async function dosyayaYaz(dizin, yol, blob) {
  const PARCA = 3 * 1024 * 1024;
  for (let o = 0; o < blob.size; o += PARCA) {
    const data = await blobBase64(blob.slice(o, o + PARCA));
    if (o === 0) await Fs().writeFile({ path: yol, data, directory: dizin, recursive: true });
    else await Fs().appendFile({ path: yol, data, directory: dizin });
  }
}

async function cbzDisaAktar(it) {
  if (!it.cbz) return 'Kayıtlı çeviri yok';
  const ad = guvenliAd(it.baslik) + '.cbz';

    for (const [dizin, etiket] of [['DOCUMENTS', 'Documents/CizgiCevirici'], ['EXTERNAL', 'uygulamanın harici klasörü/CizgiCevirici']]) {
      try {
        await dosyayaYaz(dizin, 'CizgiCevirici/' + ad, it.cbz);
        return `📦 ${etiket}/${ad}`;
      } catch (e) { console.warn('Yazılamadı:', dizin, e); }
    }
    return 'Uygulama içine kaydedildi (telefon klasörüne yazılamadı)';

  const a = document.createElement('a');

}

// ===================== DİL ALGILAMA =====================
const HARF = {
  ko: /[\uAC00-\uD7AF\u1100-\u11FF]/g,
  ja: /[\u3040-\u30FF]/g,
  zh: /[\u4E00-\u9FFF]/g,
  ru: /[\u0400-\u04FF]/g,
  ar: /[\u0600-\u06FF]/g,
  la: /[A-Za-zÀ-ÿğşıİ]/g
};
const say = (s, r) => (s.match(r) || []).length;
const KELIME = s => new Set(s.split(' '));
const STOP = {
  eng: KELIME("the and you that this what for are with not have but was your can just now it's i'm don't"),
  fra: KELIME("le la les des est que pas vous une pour dans qui je nous ce sur"),
  spa: KELIME("el los las que una por con para no es pero yo está como muy"),
  deu: KELIME("der die das und ist nicht ich du ein mit zu den wir sie"),
  ita: KELIME("il che di non sono per una con ma mi ti questo anche"),
  por: KELIME("que não uma para com os em eu você mas está isso muito"),
  tur: KELIME("ve bir bu ne ben sen için de da mi çok ama gibi ki değil"),
  ind: KELIME("yang dan tidak ini itu aku kamu dengan untuk ada saya apa")
};

function dilTahmin(m) {
  const k = say(m, HARF.ko), j = say(m, HARF.ja), z = say(m, HARF.zh),
        r = say(m, HARF.ru), a = say(m, HARF.ar), l = say(m, HARF.la);
  const top = k + j + z + r + a + l;
  if (top < 25) return null;
  if (k > top * .3) return 'kor';
  if (j >= 6 && j > z * .2) return 'jpn';
  if (z > top * .3) return /[們這個說來國時會學為麼]/.test(m) ? 'chi_tra' : 'chi_sim';
  if (r > top * .3) return 'rus';
  if (a > top * .3) return 'ara';
  const kel = m.toLowerCase().match(/[a-zà-ÿğşıüöç']+/g) || [];
  let en = 'eng', puan = 0;
  for (const [dil, set] of Object.entries(STOP)) {
    let p = 0;
    for (const w of kel) if (set.has(w)) p++;
    if (dil === 'tur') p += say(m, /[ğşıİ]/g);
    if (p > puan) { puan = p; en = dil; }
  }
  return en;
}

function ornekKirp(img, baslangic) {
  const k = img.naturalWidth < 900 ? 900 / img.naturalWidth : Math.min(1, 1200 / img.naturalWidth);
  const W = Math.round(img.naturalWidth * k), H = Math.round(img.naturalHeight * k);
  const y0 = Math.min(Math.round(H * baslangic), Math.max(0, H - 1600));
  const h = Math.min(1600, H - y0);
  const c = document.createElement('canvas');
  c.width = W; c.height = h;
  c.getContext('2d').drawImage(img, 0, y0 / k, img.naturalWidth, h / k, 0, 0, W, h);
  return c;
}

async function dilAlgila(liste, anahtar) {
  const kayit = anahtar && onbellekOku(anahtar);
  if (kayit) return kayit;
  await isciKapat();
  $('durum').textContent = 'Dil algılanıyor (ilk seferde dil verileri iner, biraz sürebilir)...';
  const w = await Tesseract.createWorker('eng+kor+jpn+chi_sim', 1);
  let metin = '';
  try {
    for (const oge of liste.slice(0, 5)) {
      if (iptal) break;
      let img;
      try { img = await resimYukle(oge, true); } catch { continue; }
      if (img.naturalWidth < 300 || img.naturalHeight < 300) continue;
      for (const b of (img.naturalHeight > 2500 ? [0, 0.35] : [0])) {
        const { data } = await w.recognize(ornekKirp(img, b));
        metin += ' ' + data.text;
        const t = dilTahmin(metin);
        if (t) { if (anahtar) onbellekYaz(anahtar, t); return t; }
      }
    }
  } finally { await w.terminate(); }
  return null;
}

// ===================== OCR VE ÇEVİRİ =====================
let isci = null, isciDil = null;
async function ociGetir(dil) {
  if (isci && isciDil === dil) return isci;
  await isciKapat();
  isci = await Tesseract.createWorker(dil, 1);
  isciDil = dil;
  return isci;
}
async function isciKapat() {
  if (isci) { try { await isci.terminate(); } catch {} }
  isci = null; isciDil = null;
}

async function hepsiniIsle(liste, it) {
  try {
    let k = it.kaynak;
    if (k === 'auto') {
      if (it.algilanan) k = it.algilanan;
      else {
        const t = await dilAlgila(liste, it.tur === 'link' ? seriAnahtari(it.link) : null);
        if (iptal) { $('durum').textContent = 'Durduruldu ⏹'; return; }
        k = t || 'eng';
        if (t) { it.algilanan = t; await kaydetItem(it); }
        else $('durum').textContent = 'Dil algılanamadı, İngilizce varsayıldı.';
      }
    }
    const kM = mKodu(k), hM = it.hedef;
    if (kM === hM) throw new Error(`Kaynak (${dilAdi(k)}) ve hedef dil aynı. 🌐 düğmesinden birini değiştir.`);

    await ociGetir(k);
    const bloblar = [];
    let hatali = 0;
    ceviriHata = 0;
    let sonraki = resimYukle(liste[0]).catch(() => null);
    for (let i = 0; i < liste.length && !iptal; i++) {
      const img = await sonraki;
      sonraki = i + 1 < liste.length ? resimYukle(liste[i + 1]).catch(() => null) : null;
      if (iptal) break;
      if (!img) hatali++;
      else if (img.naturalWidth >= 300 && img.naturalHeight >= 300) {
        try {
          const etiket = `${dilAdi(k)} → ${hedefAdi(hM)} · sayfa ${i + 1}/${liste.length}`;
          const tuval = await sayfaIsle(img, k, kM, hM, etiket);
          // İşlenen sayfayı JPEG'e çevir: hem belleği rahatlatır hem .cbz için saklanır
          const b = await new Promise(r => tuval.toBlob(r, 'image/jpeg', 0.9));
          if (b) {
            bloblar.push(b);
            const im = new Image();
            im.src = URL.createObjectURL(b);
            tuval.replaceWith(im);
          } else hatali++;
        } catch (e) { console.warn('Sayfa atlandı:', e); hatali++; }
      }
      delete liste[i].img;
      if (!liste[i].proxy) URL.revokeObjectURL(liste[i].kaynak);
    }
    if (iptal) { $('durum').textContent = 'Durduruldu ⏹'; return; }
    if (hatali || ceviriHata) {
      const parca = [];
      if (hatali) parca.push(`${hatali} sayfa yüklenemedi`);
      if (ceviriHata) parca.push(`${ceviriHata} balon çevrilemedi`);
      $('durum').textContent = `Bitti ⚠️ ${parca.join(', ')} · kaydedilmedi. Biraz sonra 🌐 → baştan çevir ile tekrar dene.`;
      return;
    }
    if (bloblar.length) {
      $('durum').textContent = 'Çeviri .cbz olarak kaydediliyor...';
      const mesaj = await cbzKaydet(it, bloblar);
      $('durum').textContent = `Bitti ✅ (${bloblar.length} sayfa) · ${mesaj}`;
    } else $('durum').textContent = 'Bitti ✅';
  } finally {
    liste.forEach(o => delete o.img);
  }
}

// Uzun webtoon şeritlerini baloncukları ortadan kesmeyecek şekilde boş satırlardan parçalara böler
const MAX_GEN = 1400, PARCA = 1800;

async function sayfaIsle(img, k, kM, hM, etiket) {
  let oran = img.naturalWidth < 900 ? 900 / img.naturalWidth : Math.min(1, MAX_GEN / img.naturalWidth);
  if (img.naturalHeight * oran > 16000) oran = 16000 / img.naturalHeight;
  const W = Math.round(img.naturalWidth * oran), H = Math.round(img.naturalHeight * oran);

  const tuval = document.createElement('canvas');
  tuval.width = W; tuval.height = H;
  const ctx = tuval.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, W, H);
  $('sayfalar').appendChild(tuval); // orijinal hemen görünür, çeviri üstüne işlenir

  const worker = await ociGetir(k);
  const nokta = kesimNoktalari(ctx, W, H);
  for (let j = 0; j < nokta.length - 1 && !iptal; j++) {
    $('durum').textContent = `${etiket} · parça ${j + 1}/${nokta.length - 1}`;
    const y0 = nokta[j], h = nokta[j + 1] - y0;
    const alt = document.createElement('canvas');
    alt.width = W; alt.height = h;
    alt.getContext('2d').drawImage(tuval, 0, y0, W, h, 0, 0, W, h);

    const { data } = await worker.recognize(alt);
    const balonlar = balonlariCikar(data, k, y0);
    if (!balonlar.length) continue;

    const ceviriler = await havuz(balonlar, 4, b => cevir(temizle(b.text, k), kM, hM));
    balonlar.forEach((b, i) => balonaYaz(ctx, b.bbox, ceviriler[i], hM));
  }
  return tuval;
}

function kesimNoktalari(ctx, W, H) {
  const n = [0];
  let y = 0;
  while (H - y > PARCA * 1.25) {
    y = enSadeSatir(ctx, W, y + PARCA - 350, y + PARCA + 350);
    n.push(y);
  }
  n.push(H);
  return n;
}

function enSadeSatir(ctx, W, a, b) {
  const H = ctx.canvas.height;
  a = Math.max(0, a); b = Math.min(H - 1, b);
  const v = ctx.getImageData(0, a, W, b - a).data;
  let en = Infinity, enY = (a + b) >> 1;
  for (let y = 0; y < b - a; y += 2) {
    let ort = 0, kare = 0, n = 0;
    for (let x = 0; x < W; x += 6) {
      const i = (y * W + x) * 4;
      const p = (v[i] + v[i + 1] + v[i + 2]) / 3;
      ort += p; kare += p * p; n++;
    }
    ort /= n;
    const varyans = kare / n - ort * ort;
    if (varyans < en) { en = varyans; enY = a + y; }
  }
  return enY;
}

// ---- OCR sonucunu balonlara ayırma: anlamsız (resim/efekt) satırları eler, yakın satırları tek balonda toplar ----
const LATIN = new Set(['eng', 'fra', 'spa', 'deu', 'ita', 'por', 'tur', 'ind']);
const SESLI = /[aeiouyáàâäãåéèêëíìîïóòôöõúùûüıİ]/i;

function kelimeGecerli(w, k) {
  const t = (w.text || '').trim();
  if (!t || w.confidence < 60) return false;
  const harf = (t.match(/\p{L}/gu) || []).length;
  if (harf < 1 || harf / t.length < 0.6) return false;
  if (!LATIN.has(k)) return true;
  if (harf === 1) return /^[AaIiOo]$/.test(t.replace(/[^\p{L}]/gu, ''));
  return SESLI.test(t); // sesli harfi olmayan "XN", "TKS" gibi çöpleri ele
}

function balonlariCikar(data, k, yOfs) {
  const paragraflar = data.paragraphs || data.blocks.flatMap(b => b.paragraphs);
  const satirlar = [];
  for (const p of paragraflar) {
    for (const l of (p.lines || [])) {
      const bb = l.bbox, yuk = bb.y1 - bb.y0;
      if (yuk < 10 || yuk > 160 || bb.x1 - bb.x0 < 12) continue;
      const kelimeler = (l.words && l.words.length) ? l.words : [{ text: l.text, confidence: l.confidence }];
      const iyi = kelimeler.filter(w => kelimeGecerli(w, k));
      if (!iyi.length || iyi.length / kelimeler.length < 0.6) continue; // satırın çoğu çöpse tüm satırı at
      satirlar.push({
        bb, yuk,
        text: iyi.map(w => w.text.trim()).join(' '),
        guven: iyi.reduce((t, w) => t + w.confidence, 0) / iyi.length
      });
    }
  }
  satirlar.sort((a, b) => a.bb.y0 - b.bb.y0);

  // Birbirine yakın ve yatayda örtüşen satırlar aynı balondur; yan yana balonlar ayrı kalır
  const gruplar = [];
  for (const s of satirlar) {
    const g = gruplar.find(g => {
      const bosluk = s.bb.y0 - g.y1;
      const kesisim = Math.min(s.bb.x1, g.x1) - Math.max(s.bb.x0, g.x0);
      return kesisim > 0 && bosluk <= Math.max(s.yuk, g.sonYuk) * 1.2;
    });
    if (g) {
      g.satirlar.push(s);
      g.x0 = Math.min(g.x0, s.bb.x0); g.x1 = Math.max(g.x1, s.bb.x1); g.y1 = Math.max(g.y1, s.bb.y1);
      g.sonYuk = s.yuk;
    } else {
      gruplar.push({ satirlar: [s], x0: s.bb.x0, y0: s.bb.y0, x1: s.bb.x1, y1: s.bb.y1, sonYuk: s.yuk });
    }
  }
  return gruplar
    .map(g => ({
      text: g.satirlar.map(s => s.text).join(' '),
      guven: g.satirlar.reduce((t, s) => t + s.guven, 0) / g.satirlar.length,
      bbox: { x0: g.x0, y0: g.y0 + yOfs, x1: g.x1, y1: g.y1 + yOfs }
    }))
    .filter(b => b.text.replace(/[^\p{L}\p{N}]/gu, '').length >= 2 && b.guven >= 62);
}

function temizle(t, k) {
  t = t.replace(/\s+/g, ' ').trim();
  if (k === 'jpn' || k === 'chi_sim' || k === 'chi_tra') {
    t = t.replace(/(?<=[\u3040-\u9FFF])\s+(?=[\u3040-\u9FFF])/g, '');
  }
  return t;
}

// Çeviri: önce Google (anahtarsız uç nokta), olmazsa MyMemory. Başarısızlıklar sayılır ve önbelleğe alınmaz.
const ceviriOnbellek = new Map();
let ceviriHata = 0;

async function jsonGetir(url) {
  if (native) {
    const r = await Http.get({ url, headers: { 'User-Agent': UA } });
    return typeof r.data === 'string' ? JSON.parse(r.data) : r.data;
  }
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const htmlCoz = s => { const ta = document.createElement('textarea'); ta.innerHTML = s; return ta.value; };

async function googleCevir(metin, kM, hM) {
  const j = await jsonGetir('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=' + kM +
                            '&tl=' + hM + '&q=' + encodeURIComponent(metin.slice(0, 1500)));
  const s = (j[0] || []).map(x => x[0]).join('');
  if (!s) throw new Error('boş yanıt');
  return s;
}

async function myMemoryCevir(metin, kM, hM) {
  const j = await jsonGetir('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(metin.slice(0, 450)) +
                            '&langpair=' + kM + '|' + hM);
  const s = j.responseData && j.responseData.translatedText;
  if (!s || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID|YOU USED ALL/i.test(s)) throw new Error('günlük limit ya da hata');
  return htmlCoz(s);
}

function cevir(metin, kM, hM) {
  const anahtar = kM + '|' + hM + '|' + metin;
  if (ceviriOnbellek.has(anahtar)) return ceviriOnbellek.get(anahtar);
  const p = (async () => {
    for (const servis of [googleCevir, myMemoryCevir]) {
      try { const s = (await servis(metin, kM, hM)).trim(); if (s) return s; }
      catch (e) { console.warn(servis.name + ' başarısız:', e.message); }
    }
    ceviriHata++;
    ceviriOnbellek.delete(anahtar); // başarısız sonuç hatırlanmasın, tekrar denenebilsin
    return metin;
  })();
  ceviriOnbellek.set(anahtar, p);
  return p;
}

async function havuz(isler, n, fn) {
  const sonuc = new Array(isler.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, isler.length) }, async () => {
    while (i < isler.length) { const k = i++; sonuc[k] = await fn(isler[k]); }
  }));
  return sonuc;
}

// Balona yazma
function zeminRengi(ctx, x, y, w, h) {
  x = Math.max(0, x | 0); y = Math.max(0, y | 0);
  w = Math.min(ctx.canvas.width - x, w | 0); h = Math.min(ctx.canvas.height - y, h | 0);
  if (w < 3 || h < 3) return [255, 255, 255];
  const d = ctx.getImageData(x, y, w, h).data;
  let r = 0, g = 0, b = 0, n = 0;
  const al = i => { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; };
  for (let i = 0; i < w; i++) { al(i * 4); al(((h - 1) * w + i) * 4); }
  for (let j = 1; j < h - 1; j++) { al(j * w * 4); al((j * w + w - 1) * 4); }
  return [r / n | 0, g / n | 0, b / n | 0];
}

// Yazının etrafındaki balon içini (aynı zemin rengindeki bölge) bulur; çeviri uzun çıkarsa oraya sığdırılır
function balonAlani(ctx, b, bg) {
  const W = ctx.canvas.width, H = ctx.canvas.height, GEN = 140; // balon en fazla 140px dışarı taşabilir
  const ham = { x: b.x0, y: b.y0, w: b.x1 - b.x0, h: b.y1 - b.y0 };
  const rx0 = Math.max(0, Math.floor(b.x0 - GEN)), ry0 = Math.max(0, Math.floor(b.y0 - GEN));
  const rx1 = Math.min(W, Math.ceil(b.x1 + GEN)), ry1 = Math.min(H, Math.ceil(b.y1 + GEN));
  const w = rx1 - rx0, h = ry1 - ry0;
  if (w < 4 || h < 4) return ham;
  const d = ctx.getImageData(rx0, ry0, w, h).data;
  const yakin = i => Math.abs(d[i] - bg[0]) < 40 && Math.abs(d[i + 1] - bg[1]) < 40 && Math.abs(d[i + 2] - bg[2]) < 40;
  const gor = new Uint8Array(w * h), yig = new Int32Array(w * h);
  let sp = 0;
  const ekle = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const i = y * w + x;
    if (!gor[i] && yakin(i * 4)) { gor[i] = 1; yig[sp++] = i; }
  };
  const ox0 = Math.floor(b.x0 - rx0), oy0 = Math.floor(b.y0 - ry0), ox1 = Math.ceil(b.x1 - rx0), oy1 = Math.ceil(b.y1 - ry0);
  for (let x = ox0; x <= ox1; x++) { ekle(x, oy0); ekle(x, oy1); }
  for (let y = oy0; y <= oy1; y++) { ekle(ox0, y); ekle(ox1, y); }
  if (!sp) return ham;
  let mx0 = w, my0 = h, mx1 = 0, my1 = 0;
  while (sp) {
    const i = yig[--sp], x = i % w, y = (i / w) | 0;
    if (x < mx0) mx0 = x; if (x > mx1) mx1 = x;
    if (y < my0) my0 = y; if (y > my1) my1 = y;
    ekle(x + 1, y); ekle(x - 1, y); ekle(x, y + 1); ekle(x, y - 1);
  }
  // Yuvarlak balonların köşeleri boştur: bölgeyi %12 küçültüp yazı alanının altına inme
  const gx = (mx1 - mx0) * 0.12, gy = (my1 - my0) * 0.12;
  const X0 = Math.min(b.x0, rx0 + mx0 + gx), Y0 = Math.min(b.y0, ry0 + my0 + gy);
  const X1 = Math.max(b.x1, rx0 + mx1 - gx), Y1 = Math.max(b.y1, ry0 + my1 - gy);
  return { x: X0, y: Y0, w: X1 - X0, h: Y1 - Y0 };
}

function balonaYaz(ctx, b, metin, hM) {
  const pad = 5;
  const x = Math.max(0, b.x0 - pad), y = Math.max(0, b.y0 - pad);
  const w = Math.min(ctx.canvas.width - x, b.x1 - b.x0 + pad * 2);
  const h = Math.min(ctx.canvas.height - y, b.y1 - b.y0 + pad * 2);

  const [r, g, bl] = zeminRengi(ctx, x, y, w, h);
  const alan = balonAlani(ctx, { x0: x, y0: y, x1: x + w, y1: y + h }, [r, g, bl]); // doldurmadan önce oku
  ctx.fillStyle = `rgb(${r},${g},${bl})`;
  ctx.fillRect(x, y, w, h); // sadece eski yazının olduğu yeri sil
  ctx.fillStyle = (0.299 * r + 0.587 * g + 0.114 * bl) > 140 ? '#000' : '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.direction = hM === 'ar' ? 'rtl' : 'ltr';

  const aw = alan.w - 12, ah = alan.h - 6;
  let satirlar = [], boyut = Math.min(44, Math.floor(ah / 1.15));
  for (; boyut >= 10; boyut--) {
    ctx.font = `bold ${boyut}px "Comic Sans MS", "Segoe UI", Arial, sans-serif`;
    satirlar = sar(ctx, metin, aw);
    if (satirlar.length * boyut * 1.15 <= ah) break;
  }
  boyut = Math.max(boyut, 10);
  let yy = alan.y + Math.max(0, (alan.h - satirlar.length * boyut * 1.15) / 2);
  satirlar.forEach(s => { ctx.fillText(s, alan.x + alan.w / 2, yy); yy += boyut * 1.15; });
}

function sar(ctx, metin, genislik) {
  const satirlar = [];
  let satir = '';
  for (const k of metin.split(' ')) {
    const dene = satir ? satir + ' ' + k : k;
    if (ctx.measureText(dene).width > genislik && satir) { satirlar.push(satir); satir = k; }
    else satir = dene;
  }
  if (satir) satirlar.push(satir);
  return satirlar;
}
